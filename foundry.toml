[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
fuzz = { runs = 512 }
fs_permissions = [{ access = "read", path = "./" }]

# Arc testnet
[rpc_endpoints]
arc_testnet = "https://rpc.testnet.arc.network"

[etherscan]
arc_testnet = { key = "verify", url = "https://testnet.arcscan.app/api", chain = 5042002 }
